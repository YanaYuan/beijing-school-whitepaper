name: 补充证据或纠正内容
description: 提交公开资料、政策更新或白皮书修订建议，请勿提交家庭隐私。
title: "[研究] "
body:
  - type: markdown
    attributes:
      value: |
        感谢参与。此仓库和所有 Issue 都公开可见。
        请勿提交学生姓名、证件、电话号码、精确家庭住址、个人预算或可识别孩子的学籍信息。
  - type: input
    id: section
    attributes:
      label: 涉及章节或问题
      placeholder: 例如：4.2 西城回区资格
    validations:
      required: true
  - type: input
    id: scope
    attributes:
      label: 适用年份、行政区、学段及具体校区
      placeholder: 例如：2027 年 / 海淀 / 小升初 / 请填写学校全称
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 发现的问题或建议修改
      description: 请区分官方事实、家长经验与分析意见。
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: 公开来源与核验日期
      description: 优先提供教委、考试中心等原文链接；暂无来源时请明确写“待核实”，不要提供带个人访问凭据的链接。
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 公开提交确认
      options:
        - label: 我确认未包含家庭隐私、学生身份材料、访问凭据或未经授权的第三方全文。
          required: true
